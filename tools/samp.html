<div class="tph"><h3>Sampling Strategy Simulator</h3><button class="xb" onclick="closeTool('samp',event)">&#x2715;</button></div>
<div class="tpb">
  <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">4 dispense heads, 50 parts each. One of them has a real problem. Same 30-part budget every time &#x2014; only the strategy changes.</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px" id="samp-btns"></div>
  <div class="mr">
    <div class="mt"><div class="mv" id="samp-m1">0</div><div class="ml">Samples from Head 3</div></div>
    <div class="mt"><div class="mv" id="samp-m2">0</div><div class="ml">Defects found there</div></div>
    <div class="mt"><div class="mv" id="samp-m3">&#x2014;</div><div class="ml">Verdict</div></div>
  </div>
  <div id="samp-insight" style="border-radius:0 var(--radius-sm) var(--radius-sm) 0;border-left:3px solid var(--border);background:var(--card);padding:11px 15px;font-size:13px;line-height:1.6;margin-bottom:16px"></div>
  <div id="samp-grid"></div>
  <div class="lg" style="margin-top:12px">
    <span><i style="background:#d8d8dc"></i>Good part</span>
    <span><i style="background:#E24B4A"></i>Defective (ground truth)</span>
    <span><i style="background:#378ADD;border-radius:2px"></i>Sampled</span>
  </div>
</div>
<script>
const sampHeadNames = ['Head 1','Head 2','Head 3','Head 4'];
const sampDefects = {
  '1':[12,37], '2':[55,72,94], '3':[101,106,111,116,121,126,131,136,141], '4':[168,195]
};
const sampAllDefects = new Set([].concat(...Object.values(sampDefects)));

const sampStrategies = {
  batch:      { label:'Grab a Batch', sub:'30 consecutive parts, one head', samples: Array.from({length:30},(_,i)=>i) },
  random:     { label:'Random Pull', sub:'Mixed, no deliberate plan', samples: Array.from({length:30},(_,i)=>i*6) },
  stratified: { label:'Stratified', sub:'Deliberately sample every head', samples: [0,7,14,21,28,35,42,50,57,64,71,78,85,92,100,106,112,118,125,131,137,143,150,156,162,168,175,181,187,193] },
  targeted:   { label:'Targeted', sub:'Aimed straight at the suspect', samples: Array.from({length:30},(_,i)=>100+i) }
};

function sampHeadOf(idx){ return Math.floor(idx/50)+1 }

function renderSampGrid(sampleSet){
  const grid = document.getElementById('samp-grid');
  grid.innerHTML = '';
  for(let h=1; h<=4; h++){
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:6px';
    const label = document.createElement('div');
    label.style.cssText = 'width:52px;font-size:11px;color:var(--muted);flex-shrink:0';
    label.textContent = sampHeadNames[h-1];
    row.appendChild(label);
    const dots = document.createElement('div');
    dots.style.cssText = 'display:flex;gap:2px;flex-wrap:wrap';
    for(let i=0;i<50;i++){
      const idx = (h-1)*50+i;
      const isDefect = sampAllDefects.has(idx);
      const isSampled = sampleSet.has(idx);
      const sq = document.createElement('div');
      sq.style.cssText = 'width:9px;height:14px;border-radius:2px;background:'+(isDefect?'#E24B4A':'#d8d8dc')+
        (isSampled?';outline:2px solid #378ADD;outline-offset:0':'');
      dots.appendChild(sq);
    }
    row.appendChild(dots);
    grid.appendChild(row);
  }
}

function renderSamp(key){
  const strat = sampStrategies[key];
  const sampleSet = new Set(strat.samples);
  renderSampGrid(sampleSet);

  const h3Samples = strat.samples.filter(x=>sampHeadOf(x)===3);
  const h3Defects = h3Samples.filter(x=>sampAllDefects.has(x));
  const rate = h3Samples.length ? h3Defects.length/h3Samples.length : 0;

  document.getElementById('samp-m1').textContent = h3Samples.length;
  document.getElementById('samp-m2').textContent = h3Defects.length;

  const insight = document.getElementById('samp-insight');
  let verdictText, verdictColor, borderColor, bg, msg;
  if(h3Samples.length===0){
    verdictText='Missed'; verdictColor='var(--red)'; borderColor='#E24B4A'; bg='#FCEBEB';
    msg='<strong>Never even looked.</strong> Every one of the 30 samples came from Head 1. The sample is "statistically valid" &#x2014; n=30 is plenty for a capability study &#x2014; and completely blind to the one head that actually has a problem.';
  } else if(rate < 0.15){
    verdictText='Weak signal'; verdictColor='#B8860B'; borderColor='#D4A017'; bg='#FCF3D9';
    msg='<strong>Barely visible.</strong> '+h3Defects.length+' defect'+(h3Defects.length===1?'':'s')+' out of '+h3Samples.length+' samples from Head 3 &#x2014; easy to write off as noise, especially against a backdrop of parts from three other heads that look fine.';
  } else if(key==='targeted'){
    verdictText='Caught'; verdictColor='var(--green)'; borderColor='#3B6D11'; bg='#EAF3DE';
    msg='<strong>Confirmed, decisively.</strong> '+h3Defects.length+' defects out of '+h3Samples.length+' samples &#x2014; a clear signal. But this strategy only works once you already suspect Head 3. It gives zero information about the other three heads.';
  } else {
    verdictText='Caught'; verdictColor='var(--green)'; borderColor='#3B6D11'; bg='#EAF3DE';
    msg='<strong>Visible, and fair.</strong> '+h3Defects.length+' defects out of '+h3Samples.length+' samples from Head 3 &#x2014; enough to flag as a real signal, while every other head got sampled too. This is the only strategy here that both catches the problem and describes the whole process.';
  }
  document.getElementById('samp-m3').textContent = verdictText;
  document.getElementById('samp-m3').style.color = verdictColor;
  insight.style.borderLeftColor = borderColor;
  insight.style.background = bg;
  insight.style.color = borderColor==='#E24B4A'?'#791F1F':(borderColor==='#3B6D11'?'#27500A':'#7a5b06');
  insight.innerHTML = msg;

  document.getElementById('samp-btns').querySelectorAll('button').forEach(b=>{
    const active = b.dataset.key===key;
    b.style.cssText = active
      ? 'padding:10px 8px;border-radius:var(--radius-sm);border:1.5px solid #378ADD;background:rgba(55,138,221,0.1);cursor:pointer;font-size:12px;font-weight:500;color:#1c4c73;line-height:1.3;text-align:center'
      : 'padding:10px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);line-height:1.3;text-align:center';
  });
}

function initSamp(){
  const row = document.getElementById('samp-btns');
  row.innerHTML = Object.keys(sampStrategies).map(k=>{
    const s = sampStrategies[k];
    return '<button data-key="'+k+'" onclick="renderSamp(\''+k+'\')">'+s.label+'<br><span style="font-weight:400">'+s.sub+'</span></button>';
  }).join('');
  renderSamp('batch');
}
initSamp();
</script>
